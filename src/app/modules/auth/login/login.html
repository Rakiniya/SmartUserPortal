<div class="login-page">

  <div class="login-card">

    <div class="logo-section">

      <h1>Secure Portal</h1>

      <p>Angular + Node.js SPA</p>

    </div>

    <div class="form-group">

      <label>User ID</label>

      <input
        type="text"
        [(ngModel)]="userId"
        placeholder="Enter User ID"
      />

    </div>

    <div class="form-group">

      <label>Password</label>

      <input
        type="password"
        [(ngModel)]="password"
        placeholder="Enter Password"
      />

    </div>

    <div class="form-group">

      <label>Role</label>

      <select [(ngModel)]="role">

        <option value="Admin">
          Admin
        </option>

        <option value="General User">
          General User
        </option>

      </select>

    </div>

    <button (click)="onLogin()">
      Login
    </button>

    <div class="demo-credentials">

  <h4>Demo Credentials</h4>

  <p>
    <strong>Admin:</strong>
    admin / admin123
  </p>

  <p>
    <strong>User:</strong>
    john / john123
  </p>

</div>

    <p
      class="error-message"
      *ngIf="errorMessage"
    >
      {{ errorMessage }}
    </p>

  </div>

</div>
