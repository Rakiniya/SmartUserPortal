<div class="login-container">

  <div class="login-card">

    <h1>Smart User Portal</h1>

    <input
      type="text"
      placeholder="User ID"
      [(ngModel)]="userId"
    />

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password"
    />

    <select [(ngModel)]="role">

      <option value="General User">
        General User
      </option>

      <option value="Admin">
        Admin
      </option>

    </select>

    <button (click)="onLogin()">

      <span *ngIf="!loading">
        Login
      </span>

      <span *ngIf="loading">
        Loading...
      </span>

    </button>

    <div
      class="error-message"
      *ngIf="errorMessage"
    >
      {{ errorMessage }}
    </div>

  </div>

</div>
