<div class="dashboard-container">

  <h1>User Dashboard</h1>

  <p>
    Welcome:
    {{ userName }}
  </p>

  <p>
    Role:
    {{ role }}
  </p>

  <button (click)="logout()">
    Logout
  </button>

  <hr>

  <div *ngIf="loading">
    Loading User Records...
  </div>

  <table border="1" *ngIf="!loading">

    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Access</th>
    </tr>

    <tr *ngFor="let record of records">

      <td>{{ record.id }}</td>

      <td>{{ record.name }}</td>

      <td>{{ record.access }}</td>

    </tr>

  </table>

</div>
