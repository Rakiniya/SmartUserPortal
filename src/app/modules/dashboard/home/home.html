<div class="dashboard-page">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <h2>Secure Portal</h2>

    <div class="user-info">

      <h3>{{ userName }}</h3>

      <p>{{ role }}</p>

    </div>

    <button (click)="logout()">
      Logout
    </button>

  </div>

  <!-- CONTENT -->
  <div class="content-area">

    <div class="top-section">

      <h1>User Dashboard</h1>

    </div>

    <div class="records-card">

      <h2>Access Records</h2>

      <!-- LOADING -->
      <div *ngIf="loading">

        <div class="spinner"></div>

        <p class="loading-text">
          Loading records...
        </p>

      </div>

      <!-- TABLE -->
      <table
        *ngIf="!loading && records.length > 0"
      >

        <tr>

          <th>ID</th>

          <th>Name</th>

          <th>Access</th>

        </tr>

        <tr *ngFor="let record of records">

          <td>{{ record.id }}</td>

          <td>{{ record.name }}</td>

          <td>

            <span class="badge">

              {{ record.access }}

            </span>

          </td>

        </tr>

      </table>

      <!-- EMPTY -->
      <p
        *ngIf="!loading && records.length === 0"
      >
        No records found.
      </p>

    </div>

  </div>

</div>
