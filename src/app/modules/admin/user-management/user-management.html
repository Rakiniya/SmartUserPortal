<div class="admin-layout">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <div>

      <div class="logo">

        <span class="logo-icon">🔐</span>

        <div class="logo-text">
          <span>Secure</span>
          <span>Portal</span>
        </div>

      </div>

      <div class="menu">

        <div class="menu-item">
          Dashboard
        </div>

        <div class="menu-item active">
          User Management
        </div>

        <div class="menu-item">
          Access Records
        </div>

        <div class="menu-item">
          Profile
        </div>

      </div>

    </div>

    <!-- PROFILE -->
    <div class="profile-card">

      <div class="avatar">
        A
      </div>

      <h3>Admin</h3>

      <p>Administrator</p>

      <button class="logout-btn" (click)="logout()">
        Logout
      </button>

    </div>

  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">

    <!-- TOPBAR -->
    <div class="topbar">

      <div class="page-header">

        <h1>User Management</h1>

        <p class="page-subtitle">
          Add and manage system users
        </p>

      </div>

      <div class="top-user">

        <span class="bell">
          🔔
        </span>

        <div class="admin-badge">
          Admin
        </div>

      </div>

    </div>

    <!-- FORM CARD -->
    <div class="form-card">

      <h2>Add User</h2>

      <div class="form-grid">

        <input type="text" [(ngModel)]="newUser.userId" placeholder="User ID" />

        <input type="password" [(ngModel)]="newUser.password" placeholder="Password" />

        <select [(ngModel)]="newUser.role">

          <option value="Admin">
            Admin
          </option>

          <option value="General User">
            General User
          </option>

        </select>

        <button (click)="addUser()">
          + Add User
        </button>

      </div>

    </div>

    <!-- TABLE -->
    <div class="table-card">

      <div class="table-header">

        <h2>User List</h2>

      </div>

      <table>

        <tr>

          <th>#</th>

          <th>User ID</th>

          <th>Role</th>

          <th>Action</th>

        </tr>

        <tr *ngFor="
            let user of users;
            let i = index
          ">

          <td>
            {{ i + 1 }}
          </td>

          <td>
            {{ user.userId }}
          </td>

          <td>

            <span class="role-badge" [ngClass]="{
                'admin-role':
                  user.role === 'Admin',

                'user-role':
                  user.role !== 'Admin'
              }">
              {{ user.role }}
            </span>

          </td>

          <td>

            <button class="delete-btn" (click)="deleteUser(
                user.userId
              )">
              Delete
            </button>

          </td>

        </tr>

      </table>

    </div>

  </div>

</div>
