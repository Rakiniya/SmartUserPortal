<div class="admin-container">

  <h1>Admin User Management</h1>

  <hr>

  <h2>Add User</h2>

  <input
    type="text"
    placeholder="User ID"
    [(ngModel)]="newUser.userId"
  />

  <input
    type="password"
    placeholder="Password"
    [(ngModel)]="newUser.password"
  />

  <select [(ngModel)]="newUser.role">

    <option value="General User">
      General User
    </option>

    <option value="Admin">
      Admin
    </option>

  </select>

  <button (click)="addUser()">
    Add User
  </button>

  <hr>

  <p *ngIf="loading">
    Loading Users...
  </p>

  <table border="1">

    <thead>

      <tr>
        <th>User ID</th>
        <th>Role</th>
        <th>Action</th>
      </tr>

    </thead>

    <tbody>

      <tr *ngFor="let user of users">

        <td>{{ user.userId }}</td>

        <td>{{ user.role }}</td>

        <td>

          <button
            (click)="deleteUser(user.userId)"
          >
            Delete
          </button>

        </td>

      </tr>

    </tbody>

  </table>

</div>
