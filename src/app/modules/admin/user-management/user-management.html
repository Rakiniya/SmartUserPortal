<div class="admin-container">

  <h1>Admin User Management</h1>

  <div class="add-user-section">

    <input
      type="text"
      placeholder="Enter User ID"
      [(ngModel)]="newUserId"
    />

    <select [(ngModel)]="newRole">

      <option value="General User">
        General User
      </option>

      <option value="Admin">
        Admin
      </option>

    </select>

    <button (click)="addUser()">
      Add User
    </button>

  </div>

  <table>

    <thead>

      <tr>
        <th>User ID</th>
        <th>Role</th>
        <th>Action</th>
      </tr>

    </thead>

    <tbody>

      <tr *ngFor="let user of users; let i = index">

        <td>{{ user.userId }}</td>

        <td>{{ user.role }}</td>

        <td>

          <button
            class="delete-btn"
            (click)="deleteUser(i)"
          >
            Delete
          </button>

        </td>

      </tr>

    </tbody>

  </table>

</div>
